components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - name
      - start_date
    AcademicYearRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
      required:
      - end_date
      - name
      - start_date
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - VIEW
      - EXPORT
      - PUBLISH
      - APPROVE
      - LOGIN
      - REJECT
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `VIEW` - View
        * `EXPORT` - Export
        * `PUBLISH` - Publish
        * `APPROVE` - Approve
        * `LOGIN` - Login
        * `REJECT` - Reject
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
        target_audience:
          $ref: '#/components/schemas/TargetAudienceEnum'
        is_published:
          type: boolean
        published_at:
          type: string
          format: date-time
          readOnly: true
        author_name:
          type: string
          readOnly: true
      required:
      - author_name
      - content
      - id
      - published_at
      - title
    AnnouncementRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        content:
